<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151c18" media="(prefers-color-scheme: dark)">
<title>bbb · prezzi Airbnb a Bologna</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="top">
    <h1 id="title">Prezzi</h1>
    <p id="stamp" class="stamp"></p>
  </header>
  <main id="view" tabindex="-1"></main>
  <nav class="tabs" aria-label="Sezioni">
    <button data-tab="prezzi" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>Prezzi</span>
    </button>
    <button data-tab="mercato">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M4 12h14M4 17h6"/><circle cx="16" cy="7" r="1.6"/><circle cx="13" cy="17" r="1.6"/></svg>
      <span>Mercato</span>
    </button>
    <button data-tab="eventi">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18l5-7 4 4 4-8 5 11"/></svg>
      <span>Eventi</span>
    </button>
    <button data-tab="dati">
      <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6.5" rx="7.5" ry="3"/><path d="M4.5 6.5v11c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-11M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3"/></svg>
      <span>Dati</span>
    </button>
  </nav>
</div>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="pricing.js"></script>
<script src="cifrato.js"></script>
<script src="app.js"></script>
</body>
</html>
